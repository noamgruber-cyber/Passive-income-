<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<title>דניאל עיצוב שיער — 390 / 768 / 1440</title>
<style>
  body{margin:0;background:#1C1A17;color:#F6F1E8;font-family:ui-monospace,Menlo,monospace;padding:20px}
  .row{display:flex;gap:22px;align-items:flex-start}
  .col p{margin:0 0 8px;font-size:12px;letter-spacing:.04em;color:#C9C0B2}
  .box{overflow:hidden;background:#F6F1E8}
  iframe{border:0;display:block;transform-origin:top right}
</style>
</head>
<body>
<div class="row">
  <div class="col">
    <p>390 × 844 — design width</p>
    <div class="box" style="width:390px;height:844px"><iframe src="Daniel Salon Homepage.dc.html" style="width:390px;height:844px"></iframe></div>
  </div>
  <div class="col">
    <p>768 × 1024 @ 0.6</p>
    <div class="box" style="width:461px;height:614px"><iframe src="Daniel Salon Homepage.dc.html" style="width:768px;height:1024px;transform:scale(.6)"></iframe></div>
  </div>
  <div class="col">
    <p>1440 × 1000 @ 0.42</p>
    <div class="box" style="width:605px;height:420px"><iframe src="Daniel Salon Homepage.dc.html" style="width:1440px;height:1000px;transform:scale(.42)"></iframe></div>
  </div>
</div>
</body>
</html>
